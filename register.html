<script>
  let avatarDataUrl = null;

  // ==== Превью аватара ====
  function previewAvatar(event) {
    const file = event.target.files[0];
    if (!file) return;

    if (file.size > 2 * 1024 * 1024) {
      alert('Файл слишком большой. Максимум 2 МБ.');
      return;
    }

    const reader = new FileReader();
    reader.onload = function(e) {
      avatarDataUrl = e.target.result;
      const preview = document.getElementById('avatarPreview');
      preview.style.backgroundImage = `url(${avatarDataUrl})`;
      preview.textContent = '';
    };
    reader.readAsDataURL(file);
  }

  // ==== Счётчики символов ====
  function updateCounter(inputId, counterId, max) {
    const len = document.getElementById(inputId).value.length;
    document.getElementById(counterId).textContent = `${len} / ${max}`;
  }

  // ==== Активация кнопки: имя + все 3 галочки ====
  const noBullying = document.getElementById('noBullying');
  const warnPhoto  = document.getElementById('warnPhoto');
  const warnName   = document.getElementById('warnName');
  const usernameEl = document.getElementById('username');
  const createBtn  = document.getElementById('createBtn');

  function checkForm() {
    const nameOk = usernameEl.value.trim().length > 0;
    const boxesOk = noBullying.checked && warnPhoto.checked && warnName.checked;
    createBtn.disabled = !(nameOk && boxesOk);
  }

  noBullying.addEventListener('change', checkForm);
  warnPhoto.addEventListener('change', checkForm);
  warnName.addEventListener('change', checkForm);
  usernameEl.addEventListener('input', checkForm);

  // ==== Создание аккаунта ====
  function createAccount() {
    const username = usernameEl.value.trim();
    const bio = document.getElementById('bio').value.trim();

    if (!username) {
      alert('Введите имя пользователя.');
      return;
    }
    if (!noBullying.checked || !warnPhoto.checked || !warnName.checked) {
      alert('Подтвердите все обязательные пункты.');
      return;
    }

    const profile = {
      username: username,
      bio: bio,
      avatar: avatarDataUrl,
      rumorsSent: 0,
      rumorsConfirmed: 0,
      createdAt: Date.now()
    };

    localStorage.setItem('profile', JSON.stringify(profile));
    localStorage.setItem('isAnonymous', 'false');

    window.location.href = 'home.html';
  }

  // Первичная проверка (на случай автозаполнения)
  checkForm();
</script>
